name: Validate Xazz Issue 2 v2

on:
  push:
    branches: [ci/xazz-issue2-v2-validation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct patch
        shell: bash
        run: bash ci/reconstruct_xazz_issue2_v2.sh "$RUNNER_TEMP/xazz_issue2_v2.patch"
      - name: Clone and apply reviewed patch
        shell: bash
        run: |
          git clone --depth 1 https://github.com/x1zzdev/Xazz.git _upstream
          cd _upstream
          git apply --check "$RUNNER_TEMP/xazz_issue2_v2.patch"
          git apply "$RUNNER_TEMP/xazz_issue2_v2.patch"
          python "$GITHUB_WORKSPACE/ci/fix_xazz_issue2_v2.py" .
      - name: Validate policy, synthetic data, and sLM dataset
        shell: bash
        working-directory: _upstream
        run: |
          python examples/security/generate_patients.py
          python experiments/slm_guardrail/validate_dataset.py
          python -m py_compile examples/security/generate_patients.py experiments/slm_guardrail/train_qlora.py experiments/slm_guardrail/validate_dataset.py
          python -m json.tool examples/security/healthcare_policy.json > /dev/null
      - name: Format and verify source
        working-directory: _upstream
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Focused security tests
        working-directory: _upstream
        run: cargo test -p xazz-server --bin security_api
      - name: Focused security clippy
        working-directory: _upstream
        run: cargo clippy -p xazz-server --bin security_api -- -D warnings
      - name: Workspace clippy
        working-directory: _upstream
        run: cargo clippy --workspace --all-targets
      - name: Workspace tests
        working-directory: _upstream
        run: cargo test --workspace

  frontend:
    name: Frontend · Visual IDE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct patch
        run: bash ci/reconstruct_xazz_issue2_v2.sh "$RUNNER_TEMP/xazz_issue2_v2.patch"
      - name: Clone and apply reviewed patch
        run: |
          git clone --depth 1 https://github.com/x1zzdev/Xazz.git _upstream
          cd _upstream
          git apply --check "$RUNNER_TEMP/xazz_issue2_v2.patch"
          git apply "$RUNNER_TEMP/xazz_issue2_v2.patch"
          python "$GITHUB_WORKSPACE/ci/fix_xazz_issue2_v2.py" .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _upstream/visual-ide/package-lock.json
      - name: Install and build
        working-directory: _upstream/visual-ide
        run: |
          npm ci
          npm run build
      - name: Contract tests
        working-directory: _upstream/visual-ide
        run: npm run test:contract
      - name: Contrast tests
        working-directory: _upstream/visual-ide
        run: |
          npx playwright install --with-deps chromium
          npm run test:contrast

  publish:
    name: Publish validated patch
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build validated patch bundle
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash ci/reconstruct_xazz_issue2_v2.sh "$RUNNER_TEMP/xazz_issue2_v2.patch"
          git clone --depth 1 https://github.com/x1zzdev/Xazz.git _upstream
          cd _upstream
          git apply --check "$RUNNER_TEMP/xazz_issue2_v2.patch"
          git apply "$RUNNER_TEMP/xazz_issue2_v2.patch"
          python "$GITHUB_WORKSPACE/ci/fix_xazz_issue2_v2.py" .
          cargo fmt --all
          mkdir -p "$RUNNER_TEMP/xazz-results"
          git diff --binary > "$RUNNER_TEMP/xazz-results/xazz_issue2_v2_validated.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/xazz-results/upstream-base-sha.txt"
          cd "$GITHUB_WORKSPACE"
          BASE_SHA="$(cat "$RUNNER_TEMP/xazz-results/upstream-base-sha.txt")"
          cat > "$RUNNER_TEMP/xazz-results/VALIDATION_REPORT.md" <<EOF
          # Xazz Issue #2 validation report

          - Upstream: https://github.com/x1zzdev/Xazz
          - Base SHA: \`${BASE_SHA}\`
          - Actions: ${RUN_URL}
          - OS: Ubuntu, Windows, macOS

          ## Passed
          - Patch application and synthetic healthcare data generation
          - Policy JSON and 10-record multi-domain sLM seed validation
          - Rust format, focused guardrail tests, focused Clippy with warnings denied
          - Workspace Clippy and workspace tests
          - Visual IDE build, contract tests, and contrast tests

          ## Honest remaining scope
          Actual CUDA QLoRA training, GGUF/public weight publication, model card publication, and trained-model quality evaluation remain follow-up work for Issue #2.
          EOF
          cat > "$RUNNER_TEMP/xazz-results/PR_BODY.md" <<'EOF'
          ## Summary
          - add deterministic Policy-as-Code inspection over Xazz AST and lineage
          - block identifiers, unsafe row-level sensitive output, unsafe training inputs, and unsafe local paths before execution
          - add local analyze/remediate/execute endpoints with exact-origin CORS, request limit, timeout, and deterministic revalidation
          - preserve policy provenance and clarify that DP does not replace identifier removal or aggregation
          - add synthetic healthcare examples and Qwen2.5-Coder/Unsloth QLoRA + Ollama scaffold

          ## Verification
          Validated on Ubuntu, Windows, and macOS; Visual IDE build/contract/contrast tests also pass.

          ## Remaining Issue #2 work
          Actual CUDA QLoRA training, GGUF/public weights, model card, and trained-model evaluation are not claimed by this PR.

          Refs #2
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: xazz-issue2-v2-validated
          path: ${{ runner.temp }}/xazz-results/
          retention-days: 30
      - name: Publish readable result branch
        run: |
          cp -R "$RUNNER_TEMP/xazz-results" /tmp/xazz-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish-xazz-issue2-v2
          git rm -rf .
          git clean -fdx
          cp -R /tmp/xazz-results/. .
          git add .
          git commit -m "ci: publish validated Xazz issue 2 patch"
          git push origin HEAD:ci/xazz-issue2-v2-results --force
