name: Validate Xazz Issue 2 Guardrail

on:
  push:
    branches:
      - ci/xazz-issue2-guardrail-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reconstruct patch
        run: |
          cat ci/xazz_issue2_patch.b64.part* | base64 -d | gzip -d > /tmp/xazz_issue2.patch
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/x1zzdev/Xazz.git _upstream
      - name: Apply patch
        working-directory: _upstream
        run: |
          git apply --check --exclude=.gitignore /tmp/xazz_issue2.patch
          git apply --exclude=.gitignore /tmp/xazz_issue2.patch
          printf '\n# Local sLM training artifacts and exported weights\nexperiments/slm_guardrail/output/\nexperiments/slm_guardrail/*.gguf\n' >> .gitignore
      - name: Validate training data
        working-directory: _upstream
        run: |
          python3 experiments/slm_guardrail/validate_dataset.py
          python3 -m py_compile experiments/slm_guardrail/train_qlora.py experiments/slm_guardrail/validate_dataset.py
      - name: Format source
        working-directory: _upstream
        run: cargo fmt --all
      - name: Upload formatted security sources
        uses: actions/upload-artifact@v4
        with:
          name: xazz-issue2-formatted-security-sources
          path: |
            _upstream/xazz-server/src/security.rs
            _upstream/xazz-server/src/bin/security_api.rs
          if-no-files-found: error
          retention-days: 1
      - name: Format check
        working-directory: _upstream
        run: cargo fmt --all -- --check
      - name: Test security API
        id: cargo_test
        working-directory: _upstream
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo test -p xazz-server --bin security_api 2>&1 | tee /tmp/xazz-cargo-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload cargo test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xazz-issue2-cargo-test-log
          path: /tmp/xazz-cargo-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after failed tests
        if: steps.cargo_test.outputs.status != '0'
        run: exit 1
      - name: Clippy
        working-directory: _upstream
        run: cargo clippy -p xazz-server --bin security_api -- -D warnings
